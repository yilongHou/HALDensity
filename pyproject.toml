[project]
name = "haldensity"
version = "0.2.0"
description = "Highly Adaptive Lasso MLE TMLE Density Estimation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.10",
    "cvxpy>=1.7",
    "optuna>=4.4",
    "ecos>=2.0.12",
    "scikit-learn>=1.3",
    "threadpoolctl>=3.1",
    "pydantic>=2.12.3",
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["density", "HAL", "TMLE", "L1", "spline", "MLE"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Framework :: Jupyter",
]

[project.urls]
Homepage = "https://github.com/yilongHou/HALDensity"
Repository = "https://github.com/yilongHou/HALDensity"
Issues = "https://github.com/yilongHou/HALDensity/issues"

[project.optional-dependencies]
cvx = ["cvxpy>=1.7", "ecos>=2.0.12", "scs>=3.2", "clarabel>=0.9"]
tuning = ["optuna>=4.4"]
# Turnbull NPMLE knot placement for interval-censored data (knot_strategy="turnbull")
turnbull = ["lifelines>=0.30.1"]
# Running the tutorials in examples/tutorials (no package code imports these)
examples = ["matplotlib>=3.9.4", "ipykernel>=6.31.0"]
dev = ["ruff>=0.6", "pytest>=7.4", "mypy>=1.7", "build>=1.2", "twine>=5.0", "nbmake>=1.5"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"haldensity" = ["py.typed", "datasets/data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow_notebook_parity: slower notebook-style parity checks for censored-data workflows",
]
