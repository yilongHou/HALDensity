name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The supported minimum (requires-python >= 3.11).
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,examples]"
      - name: Run tests
        run: python -m pytest -W error::DeprecationWarning -W error::FutureWarning
      - name: Run the tutorials
        run: python -m pytest --nbmake examples/tutorials
